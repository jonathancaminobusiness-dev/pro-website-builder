name: CI

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # tsc -b emits the workspace dist output that the unit suite resolves against,
      # so it runs before vitest rather than as a separate optional check.
      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Build
        run: corepack pnpm build

      # Unit suite only; the browser evidence runs in the release-evidence job below.
      - name: Unit tests
        run: corepack pnpm test

  # The release evidence needs the three browser engines, and Playwright's
  # Firefox build does not start on the macOS host this was developed on, so the
  # only place Firefox is actually measured is here. The artifacts are uploaded
  # because Gate 3 reads those files: a run whose evidence stayed on the runner
  # proves nothing to the captain.
  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # The unit runner inside run:evidence resolves the workspace dist output.
      - name: Build
        run: corepack pnpm build

      - name: Install Playwright browsers
        run: corepack pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Release evidence
        run: corepack pnpm run:evidence

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: artifacts/release
          if-no-files-found: error
