name: CI

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # tsc -b emits the workspace dist output that the unit suite resolves against,
      # so it runs before vitest rather than as a separate optional check.
      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Build
        run: corepack pnpm build

      # Unit suite only: the Playwright end-to-end specs need browsers and are run locally.
      - name: Unit tests
        run: corepack pnpm test
